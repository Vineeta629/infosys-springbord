<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Management</title>
    <meta charset="UTF-8">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h2 class="text-center mb-4">📦 Product Management System</h2>

        <div class="d-flex justify-content-between mb-3">
            <a href="/admin/dashboard" class="btn btn-secondary">⬅ Dashboard</a>
            <a href="/admin/products/add" class="btn btn-success">➕ Add Product</a>
        </div>
        <form th:action="@{/admin/products}" method="get" class="mb-3">

            <input type="text" name="keyword" placeholder="Search product..."
                   th:value="${keyword}" class="form-control" style="width:300px; display:inline;">

            <button type="submit" class="btn btn-primary">Search</button>

            <a href="/admin/products" class="btn btn-secondary">Reset</a>

        </form>

        <table class="table table-bordered table-hover text-center">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                
                <th>Quantity</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td th:text="${product.name}"></td>

               <!-- <td th:text="${product.category.name}"></td>-->
                <td th:text="${product.category != null ? product.category.name : 'No Category'}"></td>


                <td>
                    <span th:text="${product.quantity}"></span>

                    <span th:if="${product.quantity <= 5}" style="color:red; font-weight:bold;">
⚠ Low Stock
</span>

                </td>
                <td>₹ <span th:text="${product.price}"></span></td>

                <td>
                    <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                       class="btn btn-primary btn-sm">Edit</a>

                    <a th:href="@{/admin/products/delete/{id}(id=${product.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete?')">
                        Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
