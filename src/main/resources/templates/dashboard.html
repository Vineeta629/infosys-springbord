<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventra Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .sidebar{
            height:100vh;
            background:#1f4037;
            color:white;
            padding-top:20px;
        }

        .sidebar a{
            color:white;
            display:block;
            padding:10px;
            text-decoration:none;
        }

        .sidebar a:hover{
            background:#2f5f52;
        }

        .card-box{
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        .topbar{
            background:white;
            padding:10px 20px;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">

            <h4 class="text-center">📦 Inventra</h4>
            <hr>

            <a href="#">🏠 Dashboard</a>
            <a href="#">📦 Products</a>
           <!-- <a href="#">➕ Add Product</a>-->
            <a th:href="@{/admin/products/add}">➕Add Product</a>
            <a href="#">📂 Categories</a>
            <a href="#">👤 Users</a>

        </div>


        <!-- Main Content -->
        <div class="col-md-10">

            <!-- Topbar -->
            <div class="topbar d-flex justify-content-between">

                <h4>Admin Dashboard</h4>

                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-danger btn-sm">Logout</button>
                </form>

            </div>

            <!-- Dashboard Cards -->
            <div class="row mt-4">

                <div class="col-md-4">
                    <div class="card card-box p-3">
                        <h5>Total Products</h5>
                        <h2>25</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card card-box p-3">
                        <h5>Total Categories</h5>
                        <h2>8</h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card card-box p-3">
                        <h5>Total Users</h5>
                        <h2>5</h2>
                    </div>
                </div>

            </div>


            <!-- Recent Products -->
            <div class="card mt-4 p-3">

                <h5>Recent Products</h5>

                <table class="table">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr>
                        <td>1</td>
                        <td>Laptop</td>
                        <td>70000</td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Mouse</td>
                        <td>500</td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>
</div>

</body>
</html>
