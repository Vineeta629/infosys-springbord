<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transaction History</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#022117; color:Grey;">

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h2 class="text-center mb-4">📊 Transaction History</h2>

        <a href="/admin/products" class="btn btn-secondary mb-3">⬅ Back</a>

        <!-- 🔥 FILTER FORM -->
        <form method="get" action="/admin/transactions" class="mb-3">

            <input type="number" name="productId" placeholder="Product ID"
                   class="form-control" style="width:150px; display:inline;">

            <select name="type" class="form-select" style="width:150px; display:inline;">
                <option value="">All Type</option>
                <option value="STOCK_IN">Stock In</option>
                <option value="STOCK_OUT">Stock Out</option>
            </select>

            <button type="submit" class="btn btn-primary">Filter</button>

            <a href="/admin/transactions" class="btn btn-secondary">Reset</a>

        </form>

        <!-- 🔥 TABLE -->
        <table class="table table-bordered text-center">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Product ID</th>
                <th>Quantity</th>
                <th>Date & Time</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.type}"></td>
                <td th:text="${t.productId}"></td>
                <td th:text="${t.quantity}"></td>
                <td th:text="${t.dateTime}"></td>
            </tr>
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
