
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventra Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .sidebar{
            height:100vh;
            background:#000000;
            color:white;
            padding-top:20px;
        }

        .sidebar a{
            color:white;
            display:block;
            padding:12px;
            text-decoration:none;
            border-radius:6px;
        }

        .sidebar a:hover{
            background:#2c2c2c;
        }
.sidebar a.active{
    background:#ffc107;
    color:black;
    font-weight:bold;
}

        .card-box{
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        .topbar{
            background:white;
            padding:10px 20px;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">

            <h4 class="text-center">🛒 Inventra</h4>
            <hr>

            <a th:href="@{/admin/dashboard}">📊 Dashboard</a>
            <a th:href="@{/admin/products}">📦 Products</a>
            <a th:href="@{/admin/products/add}">➕ Add Product</a>
            <a th:href="@{/admin/categories}">📂 Categories</a>
            <a th:href="@{/admin/users}">👤 Users</a>

        </div>


        <!-- Main Content -->
        <div class="col-md-10">

            <!-- Topbar -->
            <div class="topbar d-flex justify-content-between">

                <h4>Admin Dashboard</h4>

                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-danger btn-sm">Logout</button>
                </form>

            </div>

            <!-- Dashboard Cards -->
            <div class="row mt-4">

                <div class="col-md-4">
                    <div class="card card-box bg-primary text-white p-3">
                        <h5>Total Products</h5>
                        <h2 th:text="${totalProducts}"></h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card card-box bg-success text-white p-3">
                        <h5>Total Categories</h5>
                        <h2 th:text="${totalCategories}"></h2>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card card-box bg-warning text-dark p-3">
                        <h5>Total Users</h5>
                        <h2 th:text="${totalUsers}"></h2>
                    </div>
                </div>

            </div>


            <!-- Recent Products -->
            <div class="card mt-4 p-3 shadow">

                <h5>Recent Products</h5>

                <table class="table table-hover">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="product : ${products}">

                        <td th:text="${product.id}"></td>
                        <td th:text="${product.name}"></td>
                        <td>₹ <span th:text="${product.price}"></span></td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>
</div>

</body>
</html>
```
