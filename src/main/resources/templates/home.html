

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventra Store</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">🛒 Inventra Store</a>

        <div class="ms-auto">
            <a class="btn btn-outline-light me-2" href="/login">Login</a>
            <a class="btn btn-warning" href="/register">Register</a>
        </div>
    </div>
</nav>
<h3 class="mb-3">Categories</h3>

<div class="mb-4">

    <a th:each="cat : ${categories}"
       th:href="@{/category/{id}(id=${cat.id})}"
       class="btn btn-outline-primary me-2 mb-2"
       th:text="${cat.name}">
    </a>

</div>


<!-- Products Section -->
<div class="container mt-5">

    <h2 class="text-center mb-4">Latest Products</h2>

    <div class="row">

        <div class="col-md-3 mb-4" th:each="product : ${products}">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center">


                    <h5 class="card-title">
                        <a th:href="@{/product/{id}(id=${product.id})}"
                           th:text="${product.name}"
                           style="text-decoration:none;">
                        </a>
                    </h5>


                    <p class="text-muted">
                        Category:
                        <span th:text="${product.category != null ? product.category.name : 'General'}"></span>
                    </p>

                    <h4 class="text-primary">₹ <span th:text="${product.price}"></span></h4>

                    <button class="btn btn-success mt-2">Add to Cart</button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
