<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h3 class="text-center">User Registration</h3>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <input type="text" th:field="*{name}" class="form-control" placeholder="Name"><br>

            <input type="email" th:field="*{email}" class="form-control" placeholder="Email"><br>

            <input type="password" th:field="*{password}" class="form-control" placeholder="Password"><br>

            <button class="btn btn-primary w-100">Register</button>

        </form>

    </div>

</div>

</body>
</html>
