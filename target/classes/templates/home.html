
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Inventra Store</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .product-card{
            transition:0.3s;
        }

        .product-card:hover{
            transform:translateY(-5px);
            box-shadow:0 10px 25px rgba(0,0,0,0.15);
        }

        .category-btn{
            margin:5px;
        }

    </style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">🛒 Inventra Store</a>

        <div class="ms-auto">

            <a class="btn btn-outline-light me-2" href="/cart">
                🛒 Cart (<span th:text="${cartCount}"></span>)
            </a>

            <a class="btn btn-outline-light me-2" href="/login">Login</a>

            <a class="btn btn-warning" href="/register">Register</a>

        </div>

    </div>

</nav>



<!-- Categories -->

<div class="container mt-4">

    <h3 class="mb-3">Shop by Categories</h3>

    <div>

        <a th:each="cat : ${categories}"
           th:href="@{/category/{id}(id=${cat.id})}"
           class="btn btn-outline-primary category-btn"
           th:text="${cat.name}">
        </a>

    </div>

</div>



<!-- Products -->

<div class="container mt-5">

    <h2 class="text-center mb-4">Latest Products</h2>

    <div class="row">

        <div class="col-md-3 mb-4" th:each="product : ${products}">

            <div class="card product-card h-100">

                <div class="card-body text-center">

                    <h5 class="card-title">

                        <a th:href="@{/product/{id}(id=${product.id})}"
                           th:text="${product.name}"
                           style="text-decoration:none; color:black;">
                        </a>

                    </h5>

                    <p class="text-muted">

                        Category:
                        <span th:text="${product.category != null ? product.category.name : 'General'}"></span>

                    </p>

                    <h4 class="text-primary">

                        ₹ <span th:text="${product.price}"></span>

                    </h4>

                    <a th:href="@{/cart/add/{id}(id=${product.id})}"
                       class="btn btn-success mt-2">

                        Add to Cart

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
